<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BOP Guest Log Book</title>
<meta name="theme-color" content="#1E4A2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Guest Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E4; --card:#FFFCF5; --card2:#F1EBDA; --ink:#1F2B22; --muted:#66705F; --line:#E6DCC4;
  --forest:#1E4A2C; --forest-ink:#FFFFFF; --leaf:#4E8B36; --leaf-soft:#E5EFD6; --sun:#F2B43C; --sun-ink:#1F2B22; --sun-soft:#FCEBC4;
  --red:#B4422E; --chart:#3F7F33; --banner:url("img/banner.webp"); --chart2:#F2B43C; --scrim:rgba(18,36,22,.55); --shadow:0 6px 18px rgba(30,74,44,.10);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101A13; --card:#18251C; --card2:#203127; --ink:#EAF0E6; --muted:#A3B39C; --line:#2D4033;
    --forest:#7CC46A; --forest-ink:#0C1A10; --leaf:#8BCB6E; --leaf-soft:#1E3524; --sun:#F4BE4E; --sun-ink:#1A1A10; --sun-soft:#3A2F12;
    --red:#E77A63; --chart:#7CC46A; --chart2:#F4BE4E; --scrim:rgba(0,0,0,.65); --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101A13; --card:#18251C; --card2:#203127; --ink:#EAF0E6; --muted:#A3B39C; --line:#2D4033;
  --forest:#7CC46A; --forest-ink:#0C1A10; --leaf:#8BCB6E; --leaf-soft:#1E3524; --sun:#F4BE4E; --sun-ink:#1A1A10; --sun-soft:#3A2F12;
  --red:#E77A63; --chart:#7CC46A; --chart2:#F4BE4E; --scrim:rgba(0,0,0,.65); --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#1E4A2C}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.brush{font-family:"Caveat Brush","Segoe Print","Comic Sans MS",cursive;font-weight:400;letter-spacing:.01em}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}

/* Hero banner */
.hero{position:relative;color:#fff;background-color:#1E4A2C;background-image:radial-gradient(circle at 12% 20%,rgba(124,196,106,.28),transparent 42%),radial-gradient(circle at 40% 110%,rgba(242,180,60,.16),transparent 40%),var(--banner,none);background-size:100% 100%,100% 100%,auto 100%;background-position:0 0,0 0,right center;background-repeat:no-repeat;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:22px;background:var(--bg);border-radius:22px 22px 0 0}
.hero-in{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:18px 16px 38px;display:grid;grid-template-columns:auto 1fr;column-gap:12px;row-gap:8px;align-items:center;min-height:128px}
.logo{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);flex:none}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:32px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.ttl p{margin:4px 0 0;font-size:13px;opacity:.9;font-weight:700}
.who{grid-column:2;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
@media (max-width:520px){
  .hero-in{min-height:118px}
  .logo{width:52px;height:52px}
  .ttl h1{font-size:27px}
  .ttl p{font-size:12px}
}
.chip{border:1px solid rgba(255,255,255,.45);background:rgba(10,30,16,.35);color:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;min-height:36px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sync{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.9);color:#1E4A2C;white-space:nowrap}
.sync.wait{background:var(--sun);color:#1F2B22}
.sync.off{background:#fff;color:#B4422E}
body.is-login .hero-in{min-height:230px;display:flex;flex-direction:column;justify-content:center;text-align:center;padding-top:28px}
body.is-login .logo{width:96px;height:96px}
body.is-login .ttl h1{font-size:44px}
body.is-login .hero{background-image:linear-gradient(180deg,rgba(22,58,33,.15) 0%,rgba(22,58,33,.55) 100%),radial-gradient(circle at 12% 20%,rgba(124,196,106,.28),transparent 42%),var(--banner,none);background-size:100% 100%,100% 100%,auto 100%}
body.is-login .logo{width:96px;height:96px}
@media (max-width:520px){ body.is-login .hero{background-image:linear-gradient(180deg,rgba(22,58,33,.25) 0%,rgba(22,58,33,.8) 100%),var(--banner,none);background-size:100% 100%,auto 100%} }

main{max-width:600px;margin:0 auto;padding:4px 16px 96px}
body.pay-on:not(.no-pay) main{padding-bottom:160px}
body.no-pay main{padding-bottom:96px}
body.is-login main{padding-bottom:40px}

.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;margin:0 0 10px}
.card-h h2{margin:0;font-size:26px;line-height:1.1;color:var(--forest)}
.card-h svg{width:22px;height:22px;color:var(--leaf);flex:none}
.card-h .aside{margin-left:auto;font-size:13px;color:var(--muted);font-weight:700}

.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:800;padding:8px 6px;border-radius:11px;min-height:44px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fields.one{grid-template-columns:1fr}
label.f{display:block}
label.f span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px 2px}
.inp{width:100%;height:46px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px}
textarea.inp{height:70px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--leaf);outline:none;box-shadow:0 0 0 3px var(--leaf-soft)}

.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0;padding-top:2px}
.lbl{flex:1;min-width:0}
.lbl b{display:block;font-weight:800}
.lbl small{display:block;color:var(--muted);font-size:13px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:46px;height:46px;border-radius:50%;border:0;background:var(--leaf-soft);color:var(--forest);font-size:24px;font-weight:800;line-height:1}
.step button[data-d="1"]{background:var(--forest);color:var(--forest-ink)}
.step input{width:56px;height:46px;text-align:center;font:800 22px "Nunito",system-ui,sans-serif;border:1px solid transparent;background:transparent;border-radius:12px;-moz-appearance:textfield;appearance:textfield}
.step input:focus{border-color:var(--line);background:var(--bg);outline:none}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 12px 12px 12px;min-height:84px;display:flex;flex-direction:column;gap:2px}
.tile .em{font-size:24px;line-height:1}
.tile b{font-weight:800;font-size:15px;line-height:1.2;margin-top:4px}
.tile small{color:var(--muted);font-size:12px}
.tile.on{border-color:var(--forest);background:var(--leaf-soft)}
.tile .cnt{position:absolute;top:8px;right:8px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--sun);color:var(--sun-ink);font-weight:800;display:flex;align-items:center;justify-content:center}
.tile .minus{position:absolute;right:6px;bottom:6px;width:34px;height:34px;border-radius:50%;border:0;background:var(--card);color:var(--forest);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;font-size:0;line-height:0;padding:0}
.tile.on small{padding-right:36px}
.tile .minus::before{content:"";width:12px;height:2.5px;border-radius:2px;background:currentColor}
details.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--forest);min-height:30px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--muted)}
details.more[open] summary::after{content:"–"}
.hint{font-size:13px;margin:6px 2px 0;color:var(--muted)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;font-weight:700}
.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb, var(--red) 25%, transparent)}
.combo{display:flex;flex-direction:column;gap:2px;margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--bg);border:1.5px dashed var(--line);font-size:14px}
.combo span{color:var(--muted);font-size:13px}
.combo.on{background:var(--sun-soft);border:1.5px solid var(--sun)}
.dd{position:relative}
.dd > span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 4px 2px}
.ddbtn{text-align:left;font-weight:700;color:var(--muted);position:relative;padding-right:40px;cursor:pointer}
.ddbtn.set{color:var(--ink)}
.ddbtn::after{content:"";position:absolute;right:16px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}
.ddbtn[aria-expanded="true"]::after{transform:translateY(-20%) rotate(-135deg)}
.ddpanel{position:absolute;left:0;right:0;top:100%;margin-top:6px;z-index:8;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;box-shadow:0 12px 28px rgba(18,36,22,.22)}
.ddpanel[hidden]{display:none}
.ddpanel button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;min-height:40px;padding:6px 10px;font-size:14px;font-weight:700;text-align:left;line-height:1.2}
.ddpanel button[aria-selected="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
em.req{font-style:normal;font-size:11px;font-weight:800;color:var(--sun-ink);background:var(--sun-soft);padding:1px 7px;border-radius:999px;margin-left:4px}
.mxwrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.mx{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:14px;white-space:nowrap}
.mx th,.mx td{padding:8px 10px;text-align:center}
.mx thead th{font-size:12px;color:var(--muted);font-weight:800;vertical-align:bottom;white-space:normal;min-width:64px}
.mx thead th:first-child,.mx tbody th{text-align:left}
.mx tbody th{font-weight:800}
.mx tbody td,.mx tbody th{background:var(--bg)}
.mx tbody tr th{border-radius:10px 0 0 10px}
.mx tbody tr td:last-child{border-radius:0 10px 10px 0}
.mx tr.tot th,.mx tr.tot td{background:transparent;font-weight:800;color:var(--forest)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slots button{border:1.5px solid var(--line);background:var(--bg);border-radius:16px;min-height:62px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.slots b{font-size:18px;font-weight:800}
.slots small{font-size:12px;color:var(--muted);font-weight:700}
.slots button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink);border-color:var(--forest)}
.slots button[aria-pressed="true"] small{color:inherit;opacity:.85}
.vrow{display:flex;gap:8px}
.vrow .inp{flex:1;min-width:0;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.vrow .btn{min-height:46px}
.vok{display:flex;align-items:center;gap:10px;background:var(--leaf-soft);border:1.5px solid var(--forest);border-radius:14px;padding:10px 12px}
.vok div{flex:1;min-width:0}
.vok b{display:block;font-size:17px;letter-spacing:.04em}
.vok span{font-size:13px;color:var(--muted)}
.vrm{background:none;border:0;color:var(--red);font-weight:800;min-height:40px;padding:0 6px}
.hint.ok{color:var(--leaf);font-weight:700}
.hint.warn{color:var(--red);font-weight:700}

/* Dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -6px 18px rgba(30,74,44,.08)}
.pay{max-width:600px;margin:0 auto;padding:8px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
body.no-pay .pay,body:not(.pay-on) .pay{display:none}
.tot{flex:1;min-width:0}
.amt{font:800 24px/1.1 "Nunito",system-ui,sans-serif;letter-spacing:-.02em;color:var(--forest)}
.tot small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paybtns{display:flex;gap:6px;flex:none}
.paybtns .btn{min-height:44px;padding:0 14px;font-size:15px}
@media (max-width:370px){.paybtns .btn{padding:0 10px;font-size:14px}}
.btn{border:0;border-radius:999px;min-height:52px;padding:0 18px;font-weight:800;font-size:16px}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.forest{background:var(--forest);color:var(--forest-ink)}
.btn.ghost{background:var(--card2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
nav.tabs{max-width:600px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 4px 7px;color:var(--muted);background:none;border:0;font-weight:800;font-size:13px}
nav.tabs button[aria-current="page"]{color:var(--forest)}
nav.tabs svg{width:22px;height:22px}

/* Sheet & toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:540px;border-radius:26px 26px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheet h2{margin:0;font-size:30px;color:var(--forest);text-align:center}
.samt{font:800 50px/1.05 "Nunito",system-ui,sans-serif;letter-spacing:-.02em;text-align:center;margin:8px 0 4px;color:var(--ink)}
.lines{margin:12px 0;padding:12px 14px;background:var(--bg);border-radius:14px;font-size:14px}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.lines div span:last-child{font-weight:800;text-align:right}
.actions{display:grid;gap:8px;margin-top:12px}
.done{text-align:center}
.done svg{width:84px;height:84px;margin:0 auto 6px;display:block}
.done p{margin:6px 0 14px;color:var(--muted)}
.done .bid{font-weight:800;color:var(--ink);font-size:18px}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-150%);background:var(--forest);color:var(--forest-ink);padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:30;transition:transform .25s ease;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.toast.bad{background:var(--red);color:#fff}

/* Login */
.login{text-align:center}
.login h2{font-size:34px;color:var(--forest);margin:0}
.pins{display:flex;justify-content:center;gap:12px;margin:16px 0 4px}
.pins span{width:16px;height:16px;border-radius:50%;border:2px solid var(--forest)}
.pins span.on{background:var(--forest)}
.err{min-height:22px;color:var(--red);font-weight:700;font-size:14px;margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:6px auto 14px}
.pad button{height:62px;border-radius:18px;border:1px solid var(--line);background:var(--bg);font-size:26px;font-weight:800;color:var(--forest)}
.pad button.sm{font-size:15px;color:var(--muted)}

/* Today & dashboard */
.daybar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.daybar strong{font-size:16px}
.upd{font-size:12px;font-weight:800;color:var(--muted);margin-left:auto;margin-right:8px}
.upd::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sun);margin-right:6px;animation:sk 1.2s ease-in-out infinite}
.pill{font-size:13px;font-weight:800;padding:4px 12px;border-radius:999px;background:var(--leaf-soft);color:var(--forest)}
.pill.hi{background:var(--sun-soft);color:var(--ink)}
.bigs{display:flex;gap:26px;flex-wrap:wrap}
.big{font:800 44px/1 "Nunito",system-ui,sans-serif;letter-spacing:-.03em;color:var(--forest)}
.bigs span{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-top:4px}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px}
.tally div{background:var(--bg);border-radius:14px;padding:10px 12px}
.tally b{display:block;font-size:20px;font-weight:800}
.tally span{font-size:13px;color:var(--muted);font-weight:700}
.banner-wait{display:flex;align-items:center;gap:10px;background:var(--sun-soft);border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px}
.banner-wait b{display:block}
.banner-wait .btn{min-height:40px;font-size:14px;padding:0 14px;margin-left:auto;flex:none}
.entries{margin-top:4px}
.entry{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px dashed var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.entry:first-child{border-top:0}
.entry time{color:var(--muted);font-size:13px;font-weight:700}
.entry .what{min-width:0}
.entry .what b{display:block;font-size:14px}
.entry .what small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .money{text-align:right}
.entry .money b{display:block}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:999px;background:var(--card2);margin-top:2px}
.tag.cash{background:var(--sun-soft)} .tag.upi,.tag.card{background:var(--leaf-soft);color:var(--forest)}
.tag.wait{background:var(--sun);color:var(--sun-ink)} .tag.void{color:var(--red)} .tag.check{background:var(--red);color:#fff}
.entry.void .what b,.entry.void .money b{text-decoration:line-through;color:var(--muted)}
.empty{padding:20px 4px;color:var(--muted);text-align:center}
.skel{height:16px;border-radius:8px;background:var(--card2);margin:12px 0;animation:sk 1.2s ease-in-out infinite}
@keyframes sk{50%{opacity:.5}}
.insight{font-size:32px;line-height:1.1;color:var(--forest);margin:0}
.insight-sub{margin:6px 0 0;color:var(--muted);font-size:14px}
.chart svg{width:100%;height:auto;display:block}
.chart .b{fill:var(--chart)} .chart .b.hi{fill:var(--chart2)}
.chart text{fill:var(--muted);font:10px "Nunito",system-ui,sans-serif}
.chart .base{stroke:var(--line)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:8px;font-weight:700}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--chart)}
.legend i.hi{background:var(--chart2)}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;margin:10px 0;font-size:14px}
.track{height:14px;background:var(--card2);border-radius:7px;overflow:hidden}
.fill{height:100%;background:var(--chart);border-radius:7px}
.fill.hi{background:var(--chart2)}
.hbar b{text-align:right;min-width:58px}
.sub{margin:-4px 0 10px;color:var(--muted);font-size:13px}
.seg + .seg{margin-top:8px}
@media (prefers-reduced-motion: reduce){.skel{animation:none}.toast{transition:none}}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
